[package]
name = "cloudvault"
version = "0.1.0"
description = "Zero-knowledge cloud password manager"
edition = "2021"

[lib]
name = "cloudvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
