name: Release desktop (Windows, Linux/SteamOS, macOS)

# Push a tag like v0.1.0 to build installers and attach them to a draft GitHub Release.
# 推送 v0.1.0 这样的标签，即可构建安装包并附加到 GitHub 草稿发布（Release）中。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest   # .msi + .exe (NSIS) / Windows 安装包
            args: ''
          - platform: ubuntu-22.04     # .AppImage (SteamOS/Steam Deck), .deb, .rpm / Linux 与 Steam Deck
            args: ''
          - platform: macos-latest     # universal .dmg / macOS 通用安装包
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - name: Generate app icons from app/icon.svg
        run: npx tauri icon app/icon.svg
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'CloudVault ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform below. Steam Deck / SteamOS: use the .AppImage.'
          releaseDraft: true
          args: ${{ matrix.args }}
      - name: Upload build artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: cloudvault-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.dmg
          if-no-files-found: ignore
