name: Release

# Push a tag like v0.1.0 to build every download below and attach it to a draft GitHub Release.
# Run it manually (Actions → Release → Run workflow) to get the same files as workflow artifacts only.
# 推送 v0.1.0 这样的标签，即可构建下面所有的下载包并附加到 GitHub 草稿发布（Release）中。
# 手动运行（Actions → Release → Run workflow）时，同样的文件只会作为工作流构件（artifacts）上传。
#
#   Windows   x64 / x86 (32-bit) / ARM64 : setup .exe (NSIS), .msi (x64/x86), portable .zip, "lite" .exe
#   macOS     universal / Apple Silicon / Intel : .dmg and zipped .app
#   Linux     x64 / ARM64 : .AppImage (also SteamOS), .deb, .rpm
#   Android   universal + per-ABI .apk (arm64-v8a, armeabi-v7a, x86, x86_64), .aab when signing secrets exist
#   Web       static PWA .zip, self-hosted server .zip/.tar.gz, multi-arch Docker image on GHCR
#   SHA256SUMS.txt for everything
#
# File names carry no version, so https://github.com/<owner>/<repo>/releases/latest/download/<file>
# always points at the newest published release (the README links to them).
# 文件名不带版本号，因此 https://github.com/<owner>/<repo>/releases/latest/download/<文件名>
# 永远指向最新发布的版本（README 中的下载链接就是这样写的）。
on:
  push:
    tags: ['v*']
  # Or run it from the Actions tab with a version such as v0.2.0: the workflow creates the tag and
  # release itself, so no git push is needed. Leave it empty for a test build (artifacts only).
  # 也可以在 Actions 页面手动运行并填写版本号（如 v0.2.0）：工作流会自己创建标签和发布，无需 git push。
  # 留空则只做测试构建（只上传构件）。
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to release, e.g. v0.2.0 (empty = test build only)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  # The release tag: the pushed tag, or the version typed in when run manually ('' = no release).
  # 发布标签：推送的标签，或手动运行时填写的版本号（空 = 不发布）。
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  # Create the draft release once, so parallel jobs don't race to create it.
  # 只创建一次草稿发布，避免并行任务同时去创建而冲突。
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Work out the version / 确定版本号
        run: |
          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Release tag must look like v1.2.3 or v1.2.3-beta.1 (got '$TAG')"; exit 1
            fi
            v="${TAG#v}"
          else
            v="$(node -p "require('./src-tauri/tauri.conf.json').version")-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Create draft release / 创建草稿发布
        if: env.TAG != ''
        run: |
          sed -e "s/{{VERSION}}/${{ steps.v.outputs.version }}/g" -e "s#{{REPO}}#${GITHUB_REPOSITORY,,}#g" \
            .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          # --target: on a manual run the tag doesn't exist yet; publishing creates it on this commit.
          # --target：手动运行时标签还不存在，发布时会在这个提交上创建它。
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            # re-run of an unpublished release: point it at this commit so the tag includes any fixes
            # 重新运行尚未发布的版本：让它指向当前提交，确保标签包含修复
            gh release edit "$TAG" --target "$GITHUB_SHA"
          elif ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "CloudVault $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   platform: windows, arch: x64,       target: x86_64-pc-windows-msvc,    args: '' }
          - { os: windows-latest,   platform: windows, arch: x86,       target: i686-pc-windows-msvc,      args: '' }
          # WiX (.msi) can't target ARM64, so NSIS only / WiX（.msi）不支持 ARM64，只打 NSIS 安装包
          - { os: windows-latest,   platform: windows, arch: arm64,     target: aarch64-pc-windows-msvc,   args: '--bundles nsis' }
          - { os: ubuntu-22.04,     platform: linux,   arch: x64,       target: x86_64-unknown-linux-gnu,  args: '' }
          - { os: ubuntu-22.04-arm, platform: linux,   arch: arm64,     target: aarch64-unknown-linux-gnu, args: '' }
          - { os: macos-latest,     platform: macos,   arch: universal, target: universal-apple-darwin,    args: '' }
          - { os: macos-latest,     platform: macos,   arch: arm64,     target: aarch64-apple-darwin,      args: '' }
          - { os: macos-latest,     platform: macos,   arch: x64,       target: x86_64-apple-darwin,       args: '' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux system dependencies / Linux 系统依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file xdg-utils
      - run: npm install
      - name: Generate app icons from app/icon.svg / 由 app/icon.svg 生成图标
        run: npx tauri icon app/icon.svg
      - name: Build / 构建
        run: npx tauri build --target ${{ matrix.target }} ${{ matrix.args }}
      - name: Collect downloads with consistent names / 用统一的文件名收集下载包
        run: |
          T=src-tauri/target/${{ matrix.target }}/release
          B=$T/bundle
          N="CloudVault-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p dist
          # copy the first file matching a glob, if any (e.g. no .msi for ARM64) / 复制第一个匹配的文件（如有）
          one() { for f in $1; do if [ -e "$f" ]; then cp "$f" "dist/$2"; return 0; fi; done; }
          case ${{ matrix.platform }} in
            windows)
              one "$B/nsis/*-setup.exe" "$N-setup.exe"
              one "$B/msi/*.msi"        "$N.msi"
              # Portable: unzip anywhere (e.g. a USB stick) and run. portable.txt makes the app keep its
              # data in CloudVault-data next to the .exe (see src-tauri/src/lib.rs). Needs WebView2,
              # which is built into Windows 10/11.
              # 便携版：解压到任意位置（例如 U 盘）即可运行。portable.txt 让应用把数据保存在 .exe 旁边的
              # CloudVault-data 文件夹中（见 src-tauri/src/lib.rs）。需要 WebView2，Windows 10/11 已自带。
              P="$RUNNER_TEMP/CloudVault"
              mkdir -p "$P"
              cp "$T/cloudvault.exe" "$P/CloudVault.exe"
              cp .github/portable.txt "$P/portable.txt"
              (cd "$RUNNER_TEMP" && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/$N-portable.zip" CloudVault) ;;
            linux)
              one "$B/appimage/*.AppImage" "$N.AppImage"
              one "$B/deb/*.deb"           "$N.deb"
              one "$B/rpm/*.rpm"           "$N.rpm" ;;
            macos)
              one "$B/dmg/*.dmg" "$N.dmg"
              ditto -c -k --keepParent "$B/macos/CloudVault.app" "dist/$N.app.zip" ;;
          esac
          ls -l dist
          [ -n "$(ls dist)" ]
      - uses: actions/upload-artifact@v4
        with:
          name: cloudvault-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
      - name: Attach to release / 附加到发布
        if: env.TAG != ''
        run: gh release upload "$TAG" dist/* --clobber

  # Tiny launcher for older Windows (7/8) or machines without WebView2: serves the app on localhost
  # and opens it in Edge (or the default browser). Built with the C# compiler that ships with Windows.
  # 适用于旧版 Windows（7/8）或没有 WebView2 的电脑的小型启动器：在本机提供应用并用 Edge（或默认浏览器）打开。
  # 使用 Windows 自带的 C# 编译器构建。
  windows-lite:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build / 构建
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          ./windows-launcher/build.ps1 -Out "dist/CloudVault-windows-lite.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: cloudvault-windows-lite
          path: dist/*
      - name: Attach to release / 附加到发布
        if: env.TAG != ''
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber

  android:
    needs: release
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
      # If you add these secrets, signed release APKs + an .aab (for Google Play) are built;
      # otherwise debug-signed APKs you can sideload.
      # 如果配置了这些密钥，就会构建签名的正式版 APK 和 .aab（用于 Google Play）；否则构建可侧载安装的调试签名 APK。
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # the default also installs the legacy "tools" package, which no longer exists
          # 默认还会安装已被移除的旧版 "tools" 包，所以这里只装 platform-tools
          packages: 'platform-tools'
      - name: Install NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install
      - run: npx tauri icon app/icon.svg
      - run: npx tauri android init --ci
      - name: Build APKs (universal + per-ABI) and AAB / 构建 APK（通用版 + 各 ABI 版）和 AAB
        run: |
          OUT=src-tauri/gen/android/app/build/outputs
          mkdir -p dist
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            MODE=""
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          else
            MODE="--debug"
          fi
          # Gradle ABI folder → the name users recognise / Gradle 的 ABI 目录名 → 用户熟悉的名称
          abi_name() { case "$1" in arm64) echo arm64-v8a ;; arm) echo armeabi-v7a ;; *) echo "$1" ;; esac; }
          collect() {
            for f in $(find "$OUT/apk" -name '*.apk'); do
              abi=$(abi_name "$(basename "$(dirname "$(dirname "$f")")")")
              dest="dist/CloudVault-android-$abi.apk"
              if [ -n "$MODE" ]; then cp "$f" "$dest"; else
                "$BT/zipalign" -f -p 4 "$f" "$RUNNER_TEMP/aligned.apk"
                "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
                  --ks-pass env:ANDROID_KEY_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$dest" "$RUNNER_TEMP/aligned.apk"
              fi
            done
            rm -rf "$OUT/apk"
          }
          npx tauri android build --apk $MODE
          collect
          npx tauri android build --apk --split-per-abi $MODE
          collect
          if [ -z "$MODE" ]; then
            npx tauri android build --aab
            aab=$(find "$OUT/bundle" -name '*.aab' | head -1)
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/release.jks" \
              -storepass:env ANDROID_KEY_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
              -signedjar "dist/CloudVault-android.aab" "$aab" "$ANDROID_KEY_ALIAS"
            rm "$RUNNER_TEMP/release.jks"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: cloudvault-android
          path: dist/*
      - name: Attach to release / 附加到发布
        if: env.TAG != ''
        run: gh release upload "$TAG" dist/* --clobber

  # Platform-independent downloads: the PWA and the self-hosted sync server.
  # 与平台无关的下载包：PWA 网页应用和自托管同步服务器。
  web:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package / 打包
        run: |
          mkdir -p dist stage
          # static PWA: host on any web server or open index.html / 静态 PWA：可放到任意网页服务器上
          (cd app && zip -qr "../dist/CloudVault-web.zip" .)
          # sync server + app: `node server/server.js` (Node >= 20) or `docker compose up -d`
          # 同步服务器 + 应用：`node server/server.js`（Node >= 20）或 `docker compose up -d`
          S="stage/CloudVault-server"
          mkdir -p "$S"
          cp -r app server docker-compose.yml package.json README.md LICENSE "$S/"
          rm -rf "$S/server/data"
          (cd stage && zip -qr ../dist/CloudVault-server.zip CloudVault-server \
            && tar -czf ../dist/CloudVault-server.tar.gz CloudVault-server)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: cloudvault-web
          path: dist/*
      - name: Attach to release / 附加到发布
        if: env.TAG != ''
        run: gh release upload "$TAG" dist/* --clobber

  # Server image for x86-64 servers, ARM64 (Raspberry Pi 4/5, Apple Silicon, cloud ARM) and 32-bit ARM (older Pis).
  # 服务器镜像：适用于 x86-64 服务器、ARM64（树莓派 4/5、Apple Silicon、云端 ARM）和 32 位 ARM（旧款树莓派）。
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.TAG != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.TAG != '' && !contains(env.TAG, '-') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ env.TAG != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Runs even if some builds failed, so whatever did build still gets checksums.
  # 即使部分构建失败也会运行，确保已构建好的文件都有校验和。
  checksums:
    needs: [release, desktop, windows-lite, android, web]
    if: always() && needs.release.result == 'success' && (github.ref_type == 'tag' || inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS.txt
        run: |
          mkdir assets && cd assets
          gh release download "$TAG"
          rm -f SHA256SUMS.txt
          sha256sum * | tee SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

  # Publish only when every download built, so releases/latest/download/* links never point at
  # a half-empty release. If anything failed, the release stays a draft to fix and re-run.
  # 只有所有下载包都构建成功才发布，确保 releases/latest/download/* 链接不会指向不完整的发布。
  # 如有失败，发布会保持为草稿，修复后重新运行即可。
  publish:
    needs: [release, desktop, windows-lite, android, web, checksums]
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Publish release / 发布
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json url,isDraft,assets --jq '"\(.url) draft=\(.isDraft) files=\(.assets | length)"'
