name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # the default also installs the legacy "tools" package, which no longer exists
      - name: Install NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install
      - run: npx tauri icon app/icon.svg
      - run: npx tauri android init --ci
      # If you add ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS secrets,
      # a signed release APK is built; otherwise a debug-signed APK you can sideload.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            npx tauri android build --apk
            BT="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk'); do
              out="${f%-unsigned.apk}-signed.apk"
              "$BT/zipalign" -f -p 4 "$f" "$out.aligned"
              "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
                --ks-pass env:ANDROID_KEY_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$out" "$out.aligned"
              rm "$f" "$out.aligned"
            done
            rm "$RUNNER_TEMP/release.jks"
          else
            npx tauri android build --apk --debug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cloudvault-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'); do
            cp "$f" "CloudVault-${GITHUB_REF_NAME}-$(basename "$f")"
          done
          gh release upload "$GITHUB_REF_NAME" CloudVault-*.apk --clobber || \
            gh release create "$GITHUB_REF_NAME" CloudVault-*.apk --draft --title "CloudVault $GITHUB_REF_NAME"
